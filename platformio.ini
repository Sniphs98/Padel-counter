; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 921600
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.2
    mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display@^3.0.9
    adafruit/Adafruit GFX Library@^1.11.9
    jandrassy/TelnetStream@^1.3.0
build_flags = -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=4

; OTA-Upload: pio run -e esp32dev-ota -t upload
[env:esp32dev-ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = 192.168.178.149   ; <-- IP des ESP32 eintragen (wird beim Start auf Display angezeigt)
upload_flags =
    --auth=padel123
